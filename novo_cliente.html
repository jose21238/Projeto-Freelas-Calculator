<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Freela Calculator - Novo Cliente</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="menu-navegacao">
      <a href="dashboard.html">Painel</a>
      <a href="clientes.html" class="ativo">Voltar para Clientes</a>
    </nav>
    <main class="principal">
      <section class="caixa">
        <h2>Cadastrar Novo Cliente</h2>
        <form action="clientes.html">
          <div class="campo">
            <label>Nome ou Empresa:</label>
            <input type="text" required />
          </div>
          <div class="campo">
            <label>Email de Contato:</label>
            <input type="email" required />
          </div>
          <div class="campo">
            <label>Telefone:</label>
            <input type="text" />
          </div>
          <button type="submit" class="botao">Salvar Cliente</button>
        </form>
      </section>
    </main>
  </body>
</html>
