<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Freela Calculator - Recuperar Senha</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="menu-navegacao">
      <a href="index.html">Início</a>
      <a href="login.html">Login</a>
    </nav>
    <main
      class="principal"
      style="justify-content: center; align-items: center; min-height: 60vh"
    >
      <section class="caixa" style="max-width: 400px; width: 100%">
        <header style="text-align: center; margin-bottom: 20px">
          <h1 style="font-size: 24px">Esqueci a Senha</h1>
          <p style="color: #666; font-size: 14px">
            Enviaremos um link de recuperação
          </p>
        </header>
        <form action="login.html">
          <div class="campo">
            <label>Seu Email:</label>
            <input type="email" placeholder="seu@email.com" required />
          </div>
          <button type="submit" class="botao">Enviar Link</button>
        </form>
      </section>
    </main>
  </body>
</html>
